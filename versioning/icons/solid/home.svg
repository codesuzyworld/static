<svg xmlns="http://www.w3.org/2000/svg" class="si-home" width="240" height="180" viewBox="0 0 160 120" fill="none" aria-hidden="true"><style>.si-home *{transform-box:fill-box}.si-home .k{fill:url(#si-home-g)}.si-home .sp{fill:var(--ink,#1E1F23)}.si-home .h{fill:var(--paper,#fff)}.si-home .r{stroke:var(--paper,#fff)}.si-home .gy{transform-origin:50% 100%;animation:si-in .35s cubic-bezier(.34,1.3,.64,1) both;transition:translate .25s cubic-bezier(.34,1.3,.64,1)}.si-home .sp{transform-origin:50% 50%;animation:si-pop .3s cubic-bezier(.34,1.3,.64,1) .2s both,si-twinkle 3s cubic-bezier(.45,0,.55,1) 1s infinite}:is(.ml-protect:hover,.ml-protect:focus-visible) .si-home .gy{translate:0 -4px}:is(.ml-protect:hover,.ml-protect:focus-visible) .si-home .sp{animation:si-spin .45s cubic-bezier(.34,1.3,.64,1)}@keyframes si-in{from{opacity:0;transform:translateY(10px) scale(.9,1.08)}60%{transform:scale(1.04,.96)}}@keyframes si-pop{from{opacity:0;transform:scale(0) rotate(-90deg)}}@keyframes si-twinkle{50%{transform:scale(.7) rotate(20deg);opacity:.75}}@keyframes si-spin{from{transform:scale(.4) rotate(-180deg)}to{transform:none}}@media (prefers-reduced-motion:reduce){.si-home *{animation:none!important;transition:none!important}}</style><defs><linearGradient id="si-home-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F5E433"/><stop offset="1" stop-color="#F6BA3D"/></linearGradient></defs><g class="gy"><path class="k" fill-rule="evenodd" d="M80 14 L134 56 Q139 61 133 64 H124 V106 Q124 110 120 110 H92 V86 A12 12 0 0 0 68 86 V110 H40 Q36 110 36 106 V64 H27 Q21 61 26 56 Z M80 46 A13 13 0 1 0 80.01 46 Z"/></g></svg>