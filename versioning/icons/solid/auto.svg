<svg xmlns="http://www.w3.org/2000/svg" class="si-auto" width="240" height="180" viewBox="0 0 160 120" fill="none" aria-hidden="true"><style>.si-auto *{transform-box:fill-box}.si-auto .k{fill:url(#si-auto-g)}.si-auto .sp{fill:var(--ink,#1E1F23)}.si-auto .h{fill:var(--paper,#fff)}.si-auto .r{stroke:var(--paper,#fff)}.si-auto .gy{transform-origin:50% 100%;animation:si-in .35s cubic-bezier(.34,1.3,.64,1) both;transition:translate .25s cubic-bezier(.34,1.3,.64,1)}.si-auto .sp{transform-origin:50% 50%;animation:si-pop .3s cubic-bezier(.34,1.3,.64,1) .2s both,si-twinkle 3s cubic-bezier(.45,0,.55,1) 1s infinite}:is(.ml-protect:hover,.ml-protect:focus-visible) .si-auto .gy{translate:0 -4px}:is(.ml-protect:hover,.ml-protect:focus-visible) .si-auto .sp{animation:si-spin .45s cubic-bezier(.34,1.3,.64,1)}@keyframes si-in{from{opacity:0;transform:translateY(10px) scale(.9,1.08)}60%{transform:scale(1.04,.96)}}@keyframes si-pop{from{opacity:0;transform:scale(0) rotate(-90deg)}}@keyframes si-twinkle{50%{transform:scale(.7) rotate(20deg);opacity:.75}}@keyframes si-spin{from{transform:scale(.4) rotate(-180deg)}to{transform:none}}@media (prefers-reduced-motion:reduce){.si-auto *{animation:none!important;transition:none!important}}</style><defs><linearGradient id="si-auto-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F5E433"/><stop offset="1" stop-color="#F6BA3D"/></linearGradient></defs><g class="gy"><g transform="translate(-12 -9.6) scale(1.15)"><path class="k" fill-rule="evenodd" d="M18 76 Q18 64 30 62 L50 58 L64 40 Q68 35 75 35 H103 Q110 35 114 40 L128 58 Q142 61 142 74 V84 Q142 89 137 89 H23 Q18 89 18 84 Z M69 44 H89 V57 H58 Z M95 44 H105 Q108 44 110 47 L117 57 H95 Z"/><g class="whs"><circle class="k r" cx="48" cy="89" r="15" stroke-width="6"/><circle class="h" cx="48" cy="89" r="5"/></g><g class="whs"><circle class="k r" cx="112" cy="89" r="15" stroke-width="6"/><circle class="h" cx="112" cy="89" r="5"/></g></g></g></svg>