<svg xmlns="http://www.w3.org/2000/svg" class="si-condo" width="240" height="180" viewBox="0 0 160 120" fill="none" aria-hidden="true"><style>.si-condo *{transform-box:fill-box}.si-condo .k{fill:url(#si-condo-g)}.si-condo .sp{fill:var(--ink,#1E1F23)}.si-condo .h{fill:var(--paper,#fff)}.si-condo .r{stroke:var(--paper,#fff)}.si-condo .gy{transform-origin:50% 100%;animation:si-in .35s cubic-bezier(.34,1.3,.64,1) both;transition:translate .25s cubic-bezier(.34,1.3,.64,1)}.si-condo .sp{transform-origin:50% 50%;animation:si-pop .3s cubic-bezier(.34,1.3,.64,1) .2s both,si-twinkle 3s cubic-bezier(.45,0,.55,1) 1s infinite}:is(.ml-protect:hover,.ml-protect:focus-visible) .si-condo .gy{translate:0 -4px}:is(.ml-protect:hover,.ml-protect:focus-visible) .si-condo .sp{animation:si-spin .45s cubic-bezier(.34,1.3,.64,1)}@keyframes si-in{from{opacity:0;transform:translateY(10px) scale(.9,1.08)}60%{transform:scale(1.04,.96)}}@keyframes si-pop{from{opacity:0;transform:scale(0) rotate(-90deg)}}@keyframes si-twinkle{50%{transform:scale(.7) rotate(20deg);opacity:.75}}@keyframes si-spin{from{transform:scale(.4) rotate(-180deg)}to{transform:none}}@media (prefers-reduced-motion:reduce){.si-condo *{animation:none!important;transition:none!important}}</style><defs><linearGradient id="si-condo-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F5E433"/><stop offset="1" stop-color="#F6BA3D"/></linearGradient></defs><g class="gy"><path class="k" fill-rule="evenodd" d="M36 46 Q36 42 40 42 H74 Q78 42 78 46 V110 H36 Z M46 54 H56 V62 H46 Z M60 54 H68 V62 H60 Z M46 70 H56 V78 H46 Z M60 70 H68 V78 H60 Z M46 86 H56 V94 H46 Z M60 86 H68 V94 H60 Z"/><path class="k" fill-rule="evenodd" d="M84 22 Q84 18 88 18 H120 Q124 18 124 22 V110 H84 Z M93 30 H115 V36 H93 Z M93 44 H115 V50 H93 Z M93 58 H115 V64 H93 Z M93 72 H115 V78 H93 Z M97 92 H111 V110 H97 Z"/></g></svg>