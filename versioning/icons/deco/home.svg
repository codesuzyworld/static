<svg xmlns="http://www.w3.org/2000/svg" class="di-home" width="240" height="180" viewBox="0 0 160 120" fill="none" aria-hidden="true"><style>.di-home *{transform-box:fill-box}.di-home [pathLength]{stroke-dasharray:1;stroke-dashoffset:1;animation:di-draw 1.1s cubic-bezier(.4,0,.2,1) forwards}.di-home .fan [pathLength]{animation-delay:.45s}.di-home .fan{transition:stroke .3s}:is(.ml-protect:hover,.ml-protect:focus-visible) .di-home .fan{stroke:#E0B43A}:is(.ml-protect:hover,.ml-protect:focus-visible) .di-home .fan .ray{animation:di-ray 2.4s cubic-bezier(.4,0,.2,1) calc(var(--g,0) * .22s + var(--i) * .06s) infinite}.di-home .whl{transform-origin:50% 50%}:is(.ml-protect:hover,.ml-protect:focus-visible) .di-home .whl{animation:di-roll 1.6s linear infinite}:is(.ml-protect:hover,.ml-protect:focus-visible) .di-home .body{animation:di-ride 1.6s cubic-bezier(.45,0,.55,1) infinite}@keyframes di-draw{to{stroke-dashoffset:0}}@keyframes di-ray{0%,100%{stroke-dashoffset:0}22%{stroke-dashoffset:-1}22.01%{stroke-dashoffset:1}48%{stroke-dashoffset:0}}@keyframes di-roll{to{transform:rotate(360deg)}}@keyframes di-ride{50%{transform:translateY(-1.5px)}}@media (prefers-reduced-motion:reduce){.di-home *{animation:none!important;transition:none!important}}</style><g stroke="#B58A1F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path pathLength="1" d="M26 56 L80 18 L134 56"/><path pathLength="1" d="M36 50 V106 H124 V50"/><path pathLength="1" d="M16 106 H144"/><path pathLength="1" d="M64 106 V80 A16 16 0 0 1 96 80 V106"/><g class="fan" style="--g:0"><path pathLength="1" class="ray" style="--i:0" d="M84.0 80.0 L96.0 80.0"/><path pathLength="1" class="ray" style="--i:1" d="M83.7 78.5 L94.8 73.9"/><path pathLength="1" class="ray" style="--i:2" d="M82.8 77.2 L91.3 68.7"/><path pathLength="1" class="ray" style="--i:3" d="M81.5 76.3 L86.1 65.2"/><path pathLength="1" class="ray" style="--i:4" d="M80.0 76.0 L80.0 64.0"/><path pathLength="1" class="ray" style="--i:5" d="M78.5 76.3