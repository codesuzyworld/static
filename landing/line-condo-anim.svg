<svg xmlns="http://www.w3.org/2000/svg" class="ia-condo" width="178" height="167" viewBox="-14 -14 178 167" fill="none" aria-hidden="true">
<style>
.ia-condo .s{fill:none;stroke:#B4AB4E;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.ia-condo .d{stroke-dasharray:1;stroke-dashoffset:1;animation:condo-draw .8s cubic-bezier(.65,0,.35,1) forwards}
@keyframes condo-draw{to{stroke-dashoffset:0}}
.ia-condo .fb{transform-box:fill-box}
.ia-condo .node{animation:condo-nodesoft 4s cubic-bezier(.45,0,.55,1) infinite}
:is(.ml-protect:hover,.ml-protect:focus-visible) .ia-condo .node{animation:condo-node 2.4s cubic-bezier(.45,0,.55,1) infinite}
.ia-condo .flow{animation:condo-flow 2.4s linear infinite}
:is(.ml-protect:hover,.ml-protect:focus-visible) .ia-condo .flow{animation:condo-flow .8s linear infinite}
:is(.ml-protect:hover,.ml-protect:focus-visible) .ia-condo .ant{animation:condo-ant 1.8s cubic-bezier(.45,0,.55,1) infinite}
.ia-condo .w{animation:condo-draw .8s cubic-bezier(.65,0,.35,1) forwards,condo-winsoft 4s cubic-bezier(.45,0,.55,1) infinite}
:is(.ml-protect:hover,.ml-protect:focus-visible) .ia-condo .w{animation:condo-draw .8s cubic-bezier(.65,0,.35,1) forwards,condo-blink 2.4s steps(1) infinite}
.ia-condo .shield{animation:condo-float 4s cubic-bezier(.45,0,.55,1) 1s infinite}
:is(.ml-protect:hover,.ml-protect:focus-visible) .ia-condo .shield{animation:condo-floatbig 3s cubic-bezier(.45,0,.55,1) infinite}
:is(.ml-protect:hover,.ml-protect:focus-visible) .ia-condo .bld{animation:condo-bld 2.4s cubic-bezier(.45,0,.55,1) infinite}
@keyframes condo-nodesoft{0%,100%{transform:scale(1)}20%{transform:scale(1.12)}40%{transform:scale(1)}}@keyframes condo-node{0%,100%{transform:scale(1)}20%{transform:scale(1.45)}40%{transform:scale(1)}}
.ia-condo .flow{stroke-dasharray:.18 .32}@keyframes condo-flow{from{stroke-dashoffset:.5}to{stroke-dashoffset:0}}
@keyframes condo-ant{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes condo-winsoft{0%,100%{opacity:1}40%,60%{opacity:.55}}@keyframes condo-blink{0%,100%{opacity:1}35%,60%{opacity:.15}}
@keyframes condo-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}@keyframes condo-floatbig{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes condo-bld{0%,100%{transform:none}50%{transform:scaleY(1.03)}}
@media (prefers-reduced-motion:reduce){.ia-condo *{animation:none!important}.ia-condo .d,.ia-condo .chk{stroke-dashoffset:0!important}.ia-condo .glow{opacity:0!important}}
</style>
