<svg xmlns="http://www.w3.org/2000/svg" class="ia-home" width="216" height="154" viewBox="-14 -14 216 154" fill="none" aria-hidden="true">
<style>
.ia-home .s{fill:none;stroke:#B4AB4E;stroke-width:3.7;stroke-linecap:round;stroke-linejoin:round}
.ia-home .d{stroke-dasharray:1;stroke-dashoffset:1;animation:home-draw .8s cubic-bezier(.65,0,.35,1) forwards}
@keyframes home-draw{to{stroke-dashoffset:0}}
.ia-home .fb{transform-box:fill-box}
.ia-home .glow{animation:home-glowsoft 4s cubic-bezier(.45,0,.55,1) 1s infinite}
:is(.ml-protect:hover,.ml-protect:focus-visible) .ia-home .glow{animation:home-glow 2s cubic-bezier(.45,0,.55,1) infinite}
.ia-home .sh1{animation:home-float 4s cubic-bezier(.45,0,.55,1) 1s infinite}
:is(.ml-protect:hover,.ml-protect:focus-visible) .ia-home .sh1{animation:home-lift 3.2s cubic-bezier(.45,0,.55,1) infinite}
.ia-home .chk{animation:none}
:is(.ml-protect:hover,.ml-protect:focus-visible) .ia-home .chk{animation:home-chk 4s cubic-bezier(.65,0,.35,1) infinite}
.ia-home .glow{fill:#B4AB4E;opacity:0}@keyframes home-glowsoft{0%,100%{opacity:0}50%{opacity:.25}}@keyframes home-glow{0%,100%{opacity:0;transform:scale(.6)}50%{opacity:.6;transform:scale(1)}}
@keyframes home-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}@keyframes home-floatbig{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes home-lift{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-5px) scale(1.03)}}
@keyframes home-chk{0%{stroke-dashoffset:1}18%,80%{stroke-dashoffset:0}96%,100%{stroke-dashoffset:-1}}
@media (prefers-reduced-motion:reduce){.ia-home *{animation:none!important}.ia-home .d,.ia-home .chk{stroke-dashoffset:0!important}.ia-home .glow{opacity:0!important}}
</style>
