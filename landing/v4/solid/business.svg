<svg xmlns="http://www.w3.org/2000/svg" class="si-business" width="240" height="180" viewBox="0 0 160 120" fill="none" aria-hidden="true"><style>.si-business *{transform-box:fill-box}.si-business .k{fill:url(#si-business-g)}.si-business .sp{fill:var(--ink,#1E1F23)}.si-business .h{fill:var(--paper,#fff)}.si-business .r{stroke:var(--paper,#fff)}.si-business .gy{transform-origin:50% 100%;animation:si-in .35s cubic-bezier(.34,1.3,.64,1) both;transition:translate .25s cubic-bezier(.34,1.3,.64,1)}.si-business .sp{transform-origin:50% 50%;animation:si-pop .3s cubic-bezier(.34,1.3,.64,1) .2s both,si-twinkle 3s cubic-bezier(.45,0,.55,1) 1s infinite}:is(.ml-protect:hover,.ml-protect:focus-visible) .si-business .gy{translate:0 -4px}:is(.ml-protect:hover,.ml-protect:focus-visible) .si-business .sp{animation:si-spin .45s cubic-bezier(.34,1.3,.64,1)}@keyframes si-in{from{opacity:0;transform:translateY(10px) scale(.9,1.08)}60%{transform:scale(1.04,.96)}}@keyframes si-pop{from{opacity:0;transform:scale(0) rotate(-90deg)}}@keyframes si-twinkle{50%{transform:scale(.7) rotate(20deg);opacity:.75}}@keyframes si-spin{from{transform:scale(.4) rotate(-180deg)}to{transform:none}}:is(.ml-protect:hover,.ml-protect:focus-visible) .si-business .aw{transform-origin:50% 0;animation:si-sway 1.4s ease-in-out infinite}@keyframes si-sway{25%{transform:rotate(-2.5deg)}75%{transform:rotate(2.5deg)}}@media (prefers-reduced-motion:reduce){.si-business *{animation:none!important;transition:none!important}}</style><defs><linearGradient id="si-business-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F5E433"/><stop offset="1" stop-color="#F6BA3D"/></linearGradient></defs><g class="gy"><path class="k aw" d="M28 22 H132 L140 46 A12 12 0 0 1 116 46 A12 12 0 0 1 92 46 A12 12 0 0 1 68 46 A12 12 0 0 1 44 46 A12 12 0 0 1 20 46 Z"/><path class="k" fill-rule="evenodd" d="M30 62 H130 V106 Q130 110 126 110 H34 Q30 110 30 106 Z M40 72 H84 V98 H40 Z M96 72 H120 V110 H96 Z"/></g></svg>