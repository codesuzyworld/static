<svg xmlns="http://www.w3.org/2000/svg" class="mi-business" width="240" height="180" viewBox="0 0 160 120" fill="none" aria-hidden="true"><style>.mi-business{color:var(--ink,#1E1F23)}.mi-business *{transform-box:fill-box}.mi-business [pathLength]{stroke-dasharray:1;stroke-dashoffset:1;animation:mi-draw .7s cubic-bezier(.65,0,.35,1) forwards}.mi-business .ac [pathLength]{animation-delay:.35s}.mi-business .ac{transform-origin:50% 50%;animation:mi-float 4s cubic-bezier(.45,0,.55,1) 1.2s infinite;transition:translate .3s cubic-bezier(.34,1.3,.64,1),rotate .3s cubic-bezier(.34,1.3,.64,1)}@keyframes mi-draw{to{stroke-dashoffset:0}}@keyframes mi-float{50%{transform:translateY(-2px)}}.mi-business .ac{transform-origin:50% 0}:is(.ml-protect:hover,.ml-protect:focus-visible) .mi-business .ac{animation:mi-swing 1.4s ease-in-out infinite}@keyframes mi-swing{25%{transform:rotate(-2.5deg)}75%{transform:rotate(2.5deg)}}@media (prefers-reduced-motion:reduce){.mi-business *{animation:none!important;transition:none!important}}</style><g class="ln" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path pathLength="1" d="M30 58 V108 H130 V58"/><path pathLength="1" d="M40 70 H82 V94 H40 Z"/><path pathLength="1" d="M96 108 V70 H120 V108"/><path pathLength="1" d="M18 108 H142"/><g class="ac"><path pathLength="1" d="M28 26 H132 L140 44 Q140 54 128 54 Q116 54 116 44 Q116 54 104 54 Q92 54 92 44 Q92 54 80 54 Q68 54 68 44 Q68 54 56 54 Q44 54 44 44 Q44 54 32 54 Q20 54 20 44 Z"/></g></g></svg>