<svg xmlns="http://www.w3.org/2000/svg" class="mi-condo" width="240" height="180" viewBox="0 0 160 120" fill="none" aria-hidden="true"><style>.mi-condo{color:var(--ink,#1E1F23)}.mi-condo *{transform-box:fill-box}.mi-condo [pathLength]{stroke-dasharray:1;stroke-dashoffset:1;animation:mi-draw .7s cubic-bezier(.65,0,.35,1) forwards}.mi-condo .ac [pathLength]{animation-delay:.35s}.mi-condo .ac{transform-origin:50% 50%;animation:mi-float 4s cubic-bezier(.45,0,.55,1) 1.2s infinite;transition:translate .3s cubic-bezier(.34,1.3,.64,1),rotate .3s cubic-bezier(.34,1.3,.64,1)}@keyframes mi-draw{to{stroke-dashoffset:0}}@keyframes mi-float{50%{transform:translateY(-2px)}}.mi-condo .ac{transform-origin:50% 100%}:is(.ml-protect:hover,.ml-protect:focus-visible) .mi-condo .ac{animation:mi-sway 2.4s cubic-bezier(.45,0,.55,1) infinite}@keyframes mi-sway{25%{transform:rotate(-5deg)}75%{transform:rotate(4deg)}}@media (prefers-reduced-motion:reduce){.mi-condo *{animation:none!important;transition:none!important}}</style><g class="ln" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path pathLength="1" d="M42 108 V24 Q42 20 46 20 H94 Q98 20 98 24 V108"/><path pathLength="1" d="M30 108 H130"/><path pathLength="1" d="M62 108 V94 H78 V108"/><path pathLength="1" d="M56 36 H64 M76 36 H84 M56 52 H64 M76 52 H84 M56 68 H64 M76 68 H84"/><g class="ac"><circle pathLength="1" cx="118" cy="72" r="11"/><path pathLength="1" d="M118 83 V108"/></g></g></svg>