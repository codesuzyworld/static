<svg xmlns="http://www.w3.org/2000/svg" class="mi-auto" width="240" height="180" viewBox="0 0 160 120" fill="none" aria-hidden="true"><style>.mi-auto{color:var(--ink,#1E1F23)}.mi-auto *{transform-box:fill-box}.mi-auto [pathLength]{stroke-dasharray:1;stroke-dashoffset:1;animation:mi-draw .7s cubic-bezier(.65,0,.35,1) forwards}.mi-auto .ac [pathLength]{animation-delay:.35s}.mi-auto .ac{transform-origin:50% 50%;animation:mi-float 4s cubic-bezier(.45,0,.55,1) 1.2s infinite;transition:translate .3s cubic-bezier(.34,1.3,.64,1),rotate .3s cubic-bezier(.34,1.3,.64,1)}@keyframes mi-draw{to{stroke-dashoffset:0}}@keyframes mi-float{50%{transform:translateY(-2px)}}:is(.ml-protect:hover,.ml-protect:focus-visible) .mi-auto .ac{translate:0 -4px;rotate:6deg}@media (prefers-reduced-motion:reduce){.mi-auto *{animation:none!important;transition:none!important}}</style><g class="ln" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path pathLength="1" d="M24 82 V72 Q24 66 30 65 L48 62 L62 46 Q65 43 70 43 H96 Q101 43 104 47 L116 62 Q130 64 132 72 V82 H123"/><path pathLength="1" d="M37 82 H24 M59 82 H101"/><circle pathLength="1" cx="48" cy="82" r="11"/><circle pathLength="1" cx="112" cy="82" r="11"/><path pathLength="1" d="M58 62 H106"/><g class="ac"><path pathLength="1" d="M128 16 L140 21 V30 Q140 39 128 44 Q116 39 116 30 V21 Z"/><path pathLength="1" d="M123 30 L127 34 L134 26"/></g></g></svg>