<svg xmlns="http://www.w3.org/2000/svg" class="mi-home" width="240" height="180" viewBox="0 0 160 120" fill="none" aria-hidden="true"><style>.mi-home{color:var(--ink,#1E1F23)}.mi-home *{transform-box:fill-box}.mi-home [pathLength]{stroke-dasharray:1;stroke-dashoffset:1;animation:mi-draw .7s cubic-bezier(.65,0,.35,1) forwards}.mi-home .ac [pathLength]{animation-delay:.35s}.mi-home .ac{transform-origin:50% 50%;animation:mi-float 4s cubic-bezier(.45,0,.55,1) 1.2s infinite;transition:translate .3s cubic-bezier(.34,1.3,.64,1),rotate .3s cubic-bezier(.34,1.3,.64,1)}@keyframes mi-draw{to{stroke-dashoffset:0}}@keyframes mi-float{50%{transform:translateY(-2px)}}:is(.ml-protect:hover,.ml-protect:focus-visible) .mi-home .ac{translate:0 -3px}@media (prefers-reduced-motion:reduce){.mi-home *{animation:none!important;transition:none!important}}</style><g class="ln" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path pathLength="1" d="M26 58 L80 18 L134 58"/><path pathLength="1" d="M38 50 V106 H122 V50"/><path pathLength="1" d="M70 106 V82 H90 V106"/><g class="ac"><path pathLength="1" d="M104 36 V24 H114 V44"/></g></g></svg>