<svg xmlns="http://www.w3.org/2000/svg" class="gi-business" width="240" height="180" viewBox="20 30 160 120" fill="none" aria-hidden="true"><style>.gi-business *{transform-box:fill-box}.gi-business .bk{transform-origin:50% 100%;animation:gi-rise .5s cubic-bezier(.05,.7,.1,1) both}.gi-business .gl{transform-origin:50% 100%;animation:gi-drop .55s cubic-bezier(.05,.7,.1,1) .08s both;transition:translate .3s cubic-bezier(.05,.7,.1,1)}.gi-business .gw{animation:gi-pulse 4s cubic-bezier(.45,0,.55,1) 1s infinite}.gi-business .tp{transform-origin:50% 100%;animation:gi-drop .55s cubic-bezier(.05,.7,.1,1) .16s both;transition:translate .35s cubic-bezier(.05,.7,.1,1)}:is(.ml-protect:hover,.ml-protect:focus-visible) .gi-business .tp{translate:0 -6px;transition-delay:.04s}.gi-business .dt>*{transform-origin:50% 50%;animation:gi-pop .3s cubic-bezier(.05,.7,.1,1) .26s both}:is(.ml-protect:hover,.ml-protect:focus-visible) .gi-business .gl{translate:0 -4px}@keyframes gi-rise{from{opacity:0;transform:translateY(8px) scale(.96)}}@keyframes gi-drop{from{opacity:0;transform:translateY(-14px)}}@keyframes gi-pop{from{opacity:0;transform:scale(.4)}}@keyframes gi-pulse{50%{opacity:.6}}:is(.ml-protect:hover,.ml-protect:focus-visible) .gi-business .gl{transform-origin:50% 0;animation:gi-sway 1.6s ease-in-out infinite}@keyframes gi-sway{25%{transform:rotate(-2deg)}75%{transform:rotate(2deg)}}@media (prefers-reduced-motion:reduce){.gi-business *{animation:none!important;transition:none!important}}</style><defs><linearGradient id="gi-business-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F5E433"/><stop offset="1" stop-color="#F6BA3D"/></linearGradient>
