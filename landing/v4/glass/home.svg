<svg xmlns="http://www.w3.org/2000/svg" class="gi-home" width="240" height="180" viewBox="20 30 160 120" fill="none" aria-hidden="true"><style>.gi-home *{transform-box:fill-box}.gi-home .bk{transform-origin:50% 100%;animation:gi-rise .5s cubic-bezier(.05,.7,.1,1) both}.gi-home .gl{transform-origin:50% 100%;animation:gi-drop .55s cubic-bezier(.05,.7,.1,1) .08s both;transition:translate .3s cubic-bezier(.05,.7,.1,1)}.gi-home .gw{animation:gi-pulse 4s cubic-bezier(.45,0,.55,1) 1s infinite}.gi-home .tp{transform-origin:50% 100%;animation:gi-drop .55s cubic-bezier(.05,.7,.1,1) .16s both;transition:translate .35s cubic-bezier(.05,.7,.1,1)}:is(.ml-protect:hover,.ml-protect:focus-visible) .gi-home .tp{translate:0 -6px;transition-delay:.04s}.gi-home .dt>*{transform-origin:50% 50%;animation:gi-pop .3s cubic-bezier(.05,.7,.1,1) .26s both}:is(.ml-protect:hover,.ml-protect:focus-visible) .gi-home .gl{translate:0 -4px}@keyframes gi-rise{from{opacity:0;transform:translateY(8px) scale(.96)}}@keyframes gi-drop{from{opacity:0;transform:translateY(-14px)}}@keyframes gi-pop{from{opacity:0;transform:scale(.4)}}@keyframes gi-pulse{50%{opacity:.6}}:is(.ml-protect:hover,.ml-protect:focus-visible) .gi-home .dr{animation:gi-glow 1.2s ease-in-out infinite alternate}@keyframes gi-glow{to{fill:#FFF3B0}}@media (prefers-reduced-motion:reduce){.gi-home *{animation:none!important;transition:none!important}}</style><defs><linearGradient id="gi-home-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F5E433"/><stop offset="1" stop-color="#F6BA3D"/></linearGradient>
<linearGradient id="gi-home-w" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#FFF4C4" stop-opacity=".9"/><stop offset="1" stop-color="#FBD45E" stop-opacity=".72"/></linearGradient>
<linearGradient id="gi-home-e" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity=".25"/></linearGradient>
<filter id="gi-home-b" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter><clipPath id="gi-home-c"><rect x="56" y="70" width="88" height="76" rx="6"/></clipPath></defs><g class="bk" fill="url(#gi-home-g)" stroke="url(#gi-home-g)" stroke-width="3" stroke-linejoin="round"><rect x="126" y="40" width="12" height="30" rx="1.5"/></g><g class="gl"><g clip-path="url(#gi-home-c)"><g class="gw" fill="#F6C93A" opacity=".9" filter="url(#gi-home-b)"><path d="M46 84 L100 40 L154 84 Z"/><circle cx="100" cy="112" r="22" fill="#F6BA3D"/></g><g fill="url(#gi-home-w)"><rect x="56" y="70" width="88" height="76" rx="6"/></g></g><g stroke="url(#gi-home-e)" stroke-width="1.6"><rect x="56" y="70" width="88" height="76" rx="6"/></g></g><g class="tp" fill="url(#gi-home-g)" stroke="url(#gi-home-g)" stroke-width="3" stroke-linejoin="round"><path d="M46 80 L100 38 L154 80 Z"/></g><g class="dt"><path class="dr" fill="#fff" d="M88 146 V118 a12 12 0 0 1 24 0 V146 Z"/><circle fill="#fff" cx="100" cy="98" r="6.5" opacity=".95"/></g></svg>