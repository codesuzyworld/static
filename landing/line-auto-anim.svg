<svg xmlns="http://www.w3.org/2000/svg" class="ia-auto" width="212" height="175" viewBox="-14 -14 212 175" fill="none" aria-hidden="true">
<style>
.ia-auto .s{fill:none;stroke:#B4AB4E;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.ia-auto .d{stroke-dasharray:1;stroke-dashoffset:1;animation:auto-draw .8s cubic-bezier(.65,0,.35,1) forwards}
@keyframes auto-draw{to{stroke-dashoffset:0}}
.ia-auto .fb{transform-box:fill-box}
.ia-auto .car{animation:auto-bob 3.6s cubic-bezier(.45,0,.55,1) 1s infinite}
:is(.ml-protect:hover,.ml-protect:focus-visible) .ia-auto .car{animation:auto-rock 1.6s cubic-bezier(.45,0,.55,1) infinite}
:is(.ml-protect:hover,.ml-protect:focus-visible) .ia-auto .wheel{animation:auto-spin 1.1s linear infinite}
.ia-auto .shield{animation:auto-float 4s cubic-bezier(.45,0,.55,1) 1s infinite}
:is(.ml-protect:hover,.ml-protect:focus-visible) .ia-auto .shield{animation:auto-floatbig 3s cubic-bezier(.45,0,.55,1) infinite}
.ia-auto .chk{animation:none}
:is(.ml-protect:hover,.ml-protect:focus-visible) .ia-auto .chk{animation:auto-chk 4s cubic-bezier(.65,0,.35,1) infinite}
@keyframes auto-bob{0%,100%{transform:none}50%{transform:translateY(-1px)}}@keyframes auto-rock{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-2.5px) rotate(-1.2deg)}50%{transform:translateY(0) rotate(0)}75%{transform:translateY(-1.5px) rotate(.8deg)}}
@keyframes auto-spin{to{transform:rotate(-360deg)}}
@keyframes auto-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}@keyframes auto-floatbig{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes auto-chk{0%{stroke-dashoffset:1}18%,80%{stroke-dashoffset:0}96%,100%{stroke-dashoffset:-1}}
@media (prefers-reduced-motion:reduce){.ia-auto *{animation:none!important}.ia-auto .d,.ia-auto .chk{stroke-dashoffset:0!important}.ia-auto .glow{opacity:0!important}}
</style>
