<svg xmlns="http://www.w3.org/2000/svg" class="ia-business" width="170" height="161" viewBox="-14 -14 170 161" fill="none" aria-hidden="true">
<style>
.ia-business .s{fill:none;stroke:#B4AB4E;stroke-width:4.4;stroke-linecap:round;stroke-linejoin:round}
.ia-business .d{stroke-dasharray:1;stroke-dashoffset:1;animation:business-draw .8s cubic-bezier(.65,0,.35,1) forwards}
@keyframes business-draw{to{stroke-dashoffset:0}}
.ia-business .fb{transform-box:fill-box}
.ia-business .t{animation:business-breathe 4s cubic-bezier(.45,0,.55,1) infinite}
:is(.ml-protect:hover,.ml-protect:focus-visible) .ia-business .t{animation:business-rise 1.8s cubic-bezier(.34,1.56,.64,1) infinite}
.ia-business .l{animation:business-ltsoft 4.4s steps(1) infinite}
:is(.ml-protect:hover,.ml-protect:focus-visible) .ia-business .l{animation:business-lt 2.2s steps(1) infinite}
.ia-business .s{stroke-linecap:square;stroke-linejoin:miter}@keyframes business-breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.975)}}@keyframes business-rise{0%,100%{transform:scaleY(1)}40%{transform:scaleY(.86)}70%{transform:scaleY(1.06)}}
.ia-business .l{fill:#B4AB4E}@keyframes business-ltsoft{0%,100%{opacity:.6}50%{opacity:.25}}@keyframes business-lt{0%,100%{opacity:.9}45%,70%{opacity:.1}}
@media (prefers-reduced-motion:reduce){.ia-business *{animation:none!important}.ia-business .d,.ia-business .chk{stroke-dashoffset:0!important}.ia-business .glow{opacity:0!important}}
</style>
