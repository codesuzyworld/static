<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MIB Landing Exploration</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/static/api/media/file/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/static/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f4f6fb; --card:#ffffff; --text:#0f0f0f; --muted:#5b5b60; --yellow:#f6d438; --line:rgba(0,0,0,.08); }
  @media (prefers-color-scheme: dark) { :root { --bg:#101011; --card:#1c1c1e; --text:#f3f1ea; --muted:#a3a3a8; --line:rgba(255,255,255,.08); } }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px 16px; background:var(--bg); color:var(--text); font-family:Montserrat, ui-sans-serif, system-ui, sans-serif; }
  .card { width:100%; max-width:520px; background:var(--card); border:1px solid var(--line); border-radius:32px; padding:48px 32px; text-align:center; box-shadow:0 10px 30px rgba(0,0,0,.06); }
  .logo { width:120px; height:auto; margin-bottom:32px; }
  .dark-logo { display:none; }
  @media (prefers-color-scheme: dark) { .light-logo { display:none; } .dark-logo { display:inline; } }
  h1 { font-weight:500; font-size:clamp(26px,5vw,34px); line-height:1.15; margin:0 0 12px; }
  p { color:var(--muted); font-size:15px; line-height:1.6; margin:0 0 32px; }
  .actions { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  a.btn { display:inline-flex; align-items:center; justify-content:center; min-width:72px; height:44px; padding:0 20px; border-radius:999px; font-weight:600; font-size:14px; text-decoration:none; color:var(--text); border:1px solid var(--line); }
  a.btn.primary { background:linear-gradient(90deg,#f0b84a,var(--yellow)); color:#0f0f0f; border-color:transparent; }
  a.btn:hover { filter:brightness(1.05); }
</style>
</head>
<body>
  <main class="card">
    <img class="logo light-logo" src="/static/brand/miblogo.svg" alt="My Insurance Broker">
    <img class="logo dark-logo" src="/static/brand/miblogo-dark.svg" alt="My Insurance Broker">
    <h1>This page isn’t part of the exploration yet</h1>
    <p>Only the landing page concepts are published here. Pick a version to keep exploring.</p>
    <div class="actions">
      <a class="btn" href="/static/landing/v1/">V1</a>
      <a class="btn" href="/static/landing/v2/">V2</a>
      <a class="btn primary" href="/static/personal/">V3</a>
    </div>
  </main>
</body>
</html>
